[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v
filterwarnings =
    # Ignore upstream internal deprecation warnings from third-party frameworks
    ignore::DeprecationWarning:crewai.*:
    ignore::DeprecationWarning:google.*:
    ignore::UserWarning:streamlit.*:
    ignore:.*inplace keyword in DataFrame.*:Warning:yfinance.*:
    ignore:.*inplace keyword.*:Warning:
    ignore::FutureWarning:yfinance.*:
